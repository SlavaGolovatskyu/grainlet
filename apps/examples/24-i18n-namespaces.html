<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>24 — grainlet/i18n namespaces</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 40px 20px 80px;
      background: #f4f6f8;
      color: #20252b;
      font-family: system-ui, sans-serif;
    }
    main { max-width: 920px; margin: 0 auto; }
    h1 { margin-bottom: 8px; }
    .lead { color: #5d6670; line-height: 1.5; }
    .locale-picker {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 24px 0;
    }
    button {
      padding: 7px 13px;
      border: 1px solid #cbd1d8;
      border-radius: 999px;
      background: white;
      cursor: pointer;
    }
    button.active {
      border-color: #4263eb;
      background: #4263eb;
      color: white;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
    }
    article {
      min-height: 220px;
      padding: 22px;
      border: 1px solid #e0e4e8;
      border-radius: 10px;
      background: white;
      box-shadow: 0 4px 16px rgba(22, 28, 35, 0.06);
    }
    article h2 { margin: 15px 0 10px; }
    article p { line-height: 1.5; }
    .namespace {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 5px;
      background: #edf2ff;
      color: #364fc7;
      font-family: ui-monospace, monospace;
      font-size: 0.8rem;
    }
    code {
      display: block;
      padding: 8px;
      border-radius: 5px;
      background: #f1f3f5;
      overflow-wrap: anywhere;
    }
    small, .fallback { color: #68717b; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./24-i18n-namespaces.jsx"></script>
</body>
</html>
